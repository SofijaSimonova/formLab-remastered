spring.application.name=formLab-ai-service
server.port=8090
formlab.backend.url=${FORMLAB_BACKEND_URL:http://localhost:8080}
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=formlab-ai-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

formlab.kafka.topics.workout-session-completed=workout-session-completed
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Kafka client security - defaults are for local/PLAINTEXT Kafka;
# set to SASL_SSL + credentials for a managed broker like Aiven.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.ssl.bundle=${KAFKA_SSL_BUNDLE:}
spring.ssl.bundle.pem.kafka.truststore.certificate=${KAFKA_SSL_TRUSTSTORE_CERTIFICATES:}
